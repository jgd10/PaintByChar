name: Publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mkdocs-material

      - name: Render example images
        run: |
          mkdir -p docs/assets
          python examples/basic_example.py
          python examples/styles_example.py
          python examples/preset_example.py
          cp examples/generated/output_basic.png docs/assets/output_basic.png
          cp examples/generated/style_colored_text.png docs/assets/style_colored_text.png
          cp examples/generated/output_preset_plasma.png docs/assets/output_preset_plasma.png

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
